# Defaults for the BM92T36 controller revision validated so far.
# Read every 5 seconds. Invalid config disables actions.
# Timing below applies to dock-capable/unknown models.
# Confirmed Switch Lite automatically uses poll=100ms and zero timing delays.
[usb-pd-ufp]
enabled=1
dry_run=0
poll_ms=500
settle_ms=10000
stable_ms=2000
cooldown_ms=30000
# Custom PSC ID: changing this requires restarting the module.
psc_module_id=0x7b
